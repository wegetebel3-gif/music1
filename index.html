<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Песни из 90тых и не только!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  html, body { background:#0a0a0a; color:#fff; overflow:hidden; height:100vh; }

  .intro-line {
    position: fixed; top: 50%; left: 50%;
    width: 0; height: 4px;
    background: linear-gradient(90deg, #ff2d55, #ff8800, #ffea00, #00ff88, #00e5ff, #7a5cff, #ff2d55);
    background-size: 200% 100%;
    transform: translate(-50%, -50%);
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(0,255,136,.9), 0 0 80px rgba(255,45,85,.6);
    z-index: 9999;
    animation: lineGrow 1.8s cubic-bezier(.7,0,.3,1) forwards, rainbow 2s linear infinite;
  }
  @keyframes rainbow { from{background-position:0% 50%} to{background-position:200% 50%} }
  @keyframes lineGrow {
    0%   { width: 0;     height: 4px;   opacity: 0; border-radius: 4px; }
    25%  { width: 80vw;  height: 4px;   opacity: 1; border-radius: 4px; }
    55%  { width: 95vw;  height: 95vh;  opacity: 1; border-radius: 20px; }
    80%  { width: 100vw; height: 100vh; opacity: 1; border-radius: 0; }
    100% { width: 100vw; height: 100vh; opacity: 0; border-radius: 0; visibility: hidden; }
  }

  .scene {
    position: fixed; inset: 0;
    display: flex; justify-content: center; align-items: center;
    perspective: 2000px;
    opacity: 0; animation: sceneIn 0.3s ease 1.5s forwards;
  }
  @keyframes sceneIn { to { opacity: 1; } }

  .main-page {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 40%, #0d2a1f 0%, #0a0a0a 70%);
    overflow-y: auto; overflow-x: hidden;
    transform-origin: center center;
    transition: transform 1.2s cubic-bezier(.7,0,.3,1), opacity 1.2s ease;
    z-index: 5;
  }
  .main-page.roll-up { transform: scaleY(0.002) scaleX(0.95) rotateX(20deg); opacity: 0; pointer-events: none; }

  header {
    position: sticky; top:0; left:0; right:0;
    padding: 20px 40px;
    display:flex; justify-content: space-between; align-items:center;
    background: rgba(10,10,10,0.85); backdrop-filter: blur(10px);
    z-index:100; border-bottom:1px solid #1f1f1f;
  }
  nav { display: flex; align-items: center; }
  nav.left-nav { justify-content: flex-start; }
  nav.right-nav { justify-content: flex-end; }
  nav a {
    color:#ccc; text-decoration:none;
    margin-left:35px; font-weight:600; font-size:16px;
    transition: color .3s; cursor:pointer;
  }
  nav.left-nav a { margin-left: 0; }
  nav a:hover { color:#00ff88; }

  .hero { min-height:90vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:60px 20px; position:relative; }
  .hero::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(0,229,255,.15), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(255,45,85,.15), transparent 40%);
    pointer-events:none;
  }

  .hero-title {
    font-size: clamp(32px, 6vw, 64px);
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 40px;
    text-align: center;
    background: linear-gradient(90deg, #00ff88, #00e5ff, #ff2d55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 3s infinite alternate;
    position: relative;
    z-index: 1;
    line-height: 1.2;
    padding: 0 20px;
  }

  .btn {
    display:inline-block; padding:18px 50px;
    background:linear-gradient(90deg,#00ff88,#00e5ff);
    color:#000; font-weight:900; font-size:18px;
    text-transform:uppercase; letter-spacing:2px;
    border:none; border-radius:50px; cursor:pointer;
    transition: transform .2s, box-shadow .3s;
    box-shadow: 0 0 30px rgba(0,255,136,.4);
    text-decoration:none; position: relative; z-index: 1;
  }
  .btn:hover { transform: scale(1.08); box-shadow: 0 0 50px rgba(0,255,136,.8); }

  footer { text-align:center; padding:40px 20px; color:#555; font-size:14px; background:#050505; }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    display: flex; justify-content: center; align-items: center;
    z-index: 500; opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
    padding: 20px;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    background: #111; border: 1px solid #1f1f1f; border-radius: 24px;
    padding: 50px 45px; max-width: 500px; width: 100%;
    text-align: center; position: relative;
    transform: scale(0.8);
    transition: transform .35s cubic-bezier(.7,0,.3,1);
    box-shadow: 0 0 60px rgba(0,255,136,.15);
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal::before {
    content:''; position:absolute; top:0; left:30px; right:30px; height:4px;
    background:linear-gradient(90deg,#00ff88,#00e5ff,#ff2d55);
    border-radius: 0 0 4px 4px;
  }
  .modal h2 { font-size: 32px; font-weight: 900; margin-bottom: 20px;
    background:linear-gradient(90deg,#00ff88,#00e5ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .modal p { color: #bbb; font-size: 18px; line-height: 1.7; margin-bottom: 10px; }

  .empty-message {
    text-align: center; font-size: clamp(28px, 5vw, 48px);
    font-weight: 900; letter-spacing: 2px; padding: 20px 0;
    background: linear-gradient(90deg, #00ff88, #00e5ff, #ff2d55);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    user-select: none; animation: glow 3s infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 10px rgba(0,255,136,.5)); }
    to { filter: drop-shadow(0 0 30px rgba(255,45,85,.6)); }
  }

  .modal .email {
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: 20px; padding: 14px 28px;
    background: linear-gradient(90deg, #00ff88, #00e5ff);
    color: #000; font-weight: 900; font-size: 15px;
    border: none; border-radius: 50px; cursor: pointer;
    text-decoration: none; transition: all .3s;
    box-shadow: 0 0 25px rgba(0,255,136,.4);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .modal .email:hover { transform: scale(1.05); box-shadow: 0 0 45px rgba(0,255,136,.8); }
  .modal .email.copied { background: linear-gradient(90deg, #00e5ff, #00ff88); box-shadow: 0 0 60px rgba(0,255,136,1); }
  .modal .email-sub { display: block; margin-top: 20px; font-size: 14px; color: #888; }
  .modal .email-sub strong { color: #00ff88; user-select: all; }

  .modal-close {
    position: absolute; top: 15px; right: 20px;
    background: transparent; border: none;
    color: #666; font-size: 28px; cursor: pointer;
    transition: color .3s; line-height: 1;
    z-index: 10;
  }
  .modal-close:hover { color: #ff2d55; }

  /* ===== ОТЗЫВЫ ===== */
  .reviews-form { margin-top: 20px; text-align: left; }
  .reviews-form input,
  .reviews-form textarea {
    width: 100%; padding: 12px 16px; margin-bottom: 12px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; color: #fff; font-size: 15px;
    font-family: inherit; outline: none;
    transition: all .3s; resize: vertical;
  }
  .reviews-form input:focus,
  .reviews-form textarea:focus {
    border-color: #00ff88;
    background: rgba(0,255,136,.05);
    box-shadow: 0 0 20px rgba(0,255,136,.2);
  }
  .reviews-form textarea { min-height: 90px; }
  .reviews-form button {
    width: 100%; padding: 14px;
    background: linear-gradient(90deg, #00ff88, #00e5ff);
    color: #000; font-weight: 900; font-size: 15px;
    border: none; border-radius: 50px; cursor: pointer;
    text-transform: uppercase; letter-spacing: 1px;
    transition: all .3s;
    box-shadow: 0 0 25px rgba(0,255,136,.4);
  }
  .reviews-form button:hover {
    transform: scale(1.02);
    box-shadow: 0 0 40px rgba(0,255,136,.8);
  }
  .reviews-form button:disabled { opacity: 0.6; cursor: not-allowed; }

  .reviews-list {
    margin-top: 25px; text-align: left;
    max-height: 300px; overflow-y: auto;
    padding-right: 5px;
  }
  .reviews-list::-webkit-scrollbar { width: 6px; }
  .reviews-list::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #00ff88, #00e5ff);
    border-radius: 3px;
  }
  .review-item {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
    animation: reviewIn 0.5s ease;
  }
  @keyframes reviewIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .review-header {
    display: flex; justify-content: space-between;
    margin-bottom: 6px; font-size: 13px;
  }
  .review-name { color: #00ff88; font-weight: 700; }
  .review-date { color: #666; }
  .review-text { color: #ddd; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
  .reviews-loading { text-align: center; color: #888; padding: 20px; font-size: 14px; }

  /* ===== МУЗЫКА ===== */
  .music-page {
    position: absolute; inset: 0;
    background:#000;
    display:flex; flex-direction:column;
    overflow:hidden;
    transform: scaleY(0.002) scaleX(0.95);
    opacity: 0; pointer-events: none;
    transition: transform 1.2s cubic-bezier(.7,0,.3,1), opacity 0.6s ease;
    z-index: 1;
  }
  .music-page.unroll { transform: scaleY(1) scaleX(1); opacity: 1; pointer-events: auto; z-index: 10; }
  .music-page::before {
    content:''; position:absolute; inset:0;
    background:
      radial-gradient(circle at 30% 40%, rgba(0,255,136,.15), transparent 50%),
      radial-gradient(circle at 70% 60%, rgba(255,45,85,.15), transparent 50%);
    animation: pulse 4s infinite alternate;
    pointer-events: none;
  }
  @keyframes pulse {
    from { opacity:.4; transform:scale(1); }
    to { opacity:1; transform:scale(1.2); }
  }

  .music-header {
    position: relative; z-index: 2;
    padding: 20px 40px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.5); backdrop-filter: blur(10px);
    flex-wrap: wrap; gap: 15px;
  }
  .music-logo {
    font-size: 24px; font-weight: 900;
    background:linear-gradient(90deg,#00ff88,#00e5ff,#ff2d55);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    letter-spacing: 2px;
  }
  .music-header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .search-box {
    padding: 10px 18px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 50px; color: #fff; font-size: 14px;
    outline: none; width: 220px; transition: all .3s;
  }
  .search-box:focus { border-color: #00ff88; background: rgba(0,255,136,.05); box-shadow: 0 0 20px rgba(0,255,136,.3); }
  .search-box::placeholder { color: #666; }

  .back-btn {
    padding:10px 22px;
    background:transparent; color:#00ff88;
    border:2px solid #00ff88; border-radius:50px;
    font-weight:700; font-size:14px;
    transition: all .3s; cursor:pointer;
    white-space: nowrap;
  }
  .back-btn:hover { background:#00ff88; color:#000; box-shadow:0 0 25px rgba(0,255,136,.7); }

  .music-content {
    position: relative; z-index: 2;
    flex: 1; overflow-y: auto;
    padding: 30px 40px 60px 40px;
  }
  .music-content::-webkit-scrollbar { width: 8px; }
  .music-content::-webkit-scrollbar-track { background: rgba(255,255,255,.02); }
  .music-content::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00ff88, #00e5ff); border-radius: 4px; }

  .music-title {
    text-align: center;
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 900; margin-bottom: 10px;
    background: linear-gradient(90deg,#00ff88,#00e5ff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .music-subtitle { text-align: center; color: #888; margin-bottom: 40px; font-size: 15px; }

  .track-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px; max-width: 1400px; margin: 0 auto;
  }
  .track {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 15px; overflow: hidden;
    cursor: pointer; transition: all .3s; position: relative;
  }
  .track:hover {
    transform: translateY(-5px);
    border-color: rgba(0,255,136,.5);
    box-shadow: 0 10px 40px rgba(0,255,136,.2);
  }
  .track.active { border-color: #00ff88; box-shadow: 0 0 40px rgba(0,255,136,.4); }
  .track.hidden { display: none; }

  .track-video {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #111; overflow: hidden;
  }
  .track-video video {
    width: 100%; height: 100%; object-fit: cover;
    display: block; pointer-events: none;
  }
  .track-play-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.4); transition: background .3s;
    pointer-events: none;
  }
  .track:hover .track-play-overlay { background: rgba(0,0,0,.15); }
  .track-play-overlay::before {
    content: '▶';
    width: 55px; height: 55px; border-radius: 50%;
    background: linear-gradient(135deg, #00ff88, #00e5ff);
    color: #000; display: flex; align-items: center; justify-content: center;
    font-size: 20px; padding-left: 5px;
    box-shadow: 0 0 30px rgba(0,255,136,.8);
    transition: transform .3s;
  }
  .track:hover .track-play-overlay::before { transform: scale(1.15); }
  .track.active .track-play-overlay::before {
    content: '♪';
    background: linear-gradient(135deg, #ff2d55, #ff8800);
    padding-left: 0;
    animation: musicBounce 0.6s infinite alternate;
  }
  @keyframes musicBounce {
    from { transform: scale(1); }
    to { transform: scale(1.15); }
  }

  .track-info { padding: 15px 18px; }
  .track-name {
    font-weight: 700; font-size: 15px;
    color: #fff; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-artist {
    font-size: 13px; color: #888;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track.active .track-name { color: #00ff88; }

  .donate-btn {
    padding: 12px 24px;
    background: linear-gradient(135deg, #ff2d55, #ff8800);
    color: #fff; border: none; border-radius: 50px;
    font-weight: 900; font-size: 14px;
    cursor: pointer; text-transform: uppercase;
    letter-spacing: 1px; white-space: nowrap;
    transition: transform .2s, box-shadow .3s;
    position: fixed; bottom: 20px; right: 20px; z-index: 50;
  }
  .donate-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255,45,85,.8); }

  .video-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.95);
    backdrop-filter: blur(15px);
    display: flex; align-items: center; justify-content: center;
    z-index: 600; opacity: 0; pointer-events: none;
    transition: opacity .3s; padding: 20px;
  }
  .video-modal.show { opacity: 1; pointer-events: auto; }
  .video-modal-content {
    position: relative; max-width: 90vw; max-height: 90vh;
    border-radius: 20px; overflow: hidden;
    box-shadow:
      0 0 60px rgba(0,255,136,.5),
      0 0 120px rgba(255,45,85,.3);
    border: 2px solid rgba(0,255,136,.4);
  }
  .video-modal video {
    display: block; max-width: 90vw; max-height: 90vh;
    background: #000;
  }
  .video-modal-close {
    position: absolute; top: 20px; right: 20px;
    width: 45px; height: 45px; border-radius: 50%;
    background: linear-gradient(135deg, #ff2d55, #ff8800);
    border: none; color: #fff; font-size: 24px; cursor: pointer;
    z-index: 10; transition: transform .2s;
  }
  .video-modal-close:hover { transform: scale(1.1) rotate(90deg); }

  @media (max-width: 600px) {
    .donate-btn { padding: 10px 15px; font-size: 12px; bottom: 15px; right: 15px; }
    .music-content { padding: 20px 15px 60px 15px; }
    .music-header { padding: 15px 20px; }
    .search-box { width: 100%; }
    header { padding: 15px 20px; }
    nav a { font-size: 14px; margin-left: 20px; }
    .modal { padding: 35px 25px; }
  }

  /* ===== ЭКРАН ЗАГРУЗКИ ===== */
  .loading-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, #0d2a1f 0%, #0a0a0a 80%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    transition: opacity 0.8s ease;
  }
  .loading-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .loader-spinner {
    width: 80px;
    height: 80px;
    border: 4px solid rgba(0,255,136,.15);
    border-top: 4px solid #00ff88;
    border-right: 4px solid #00e5ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 40px rgba(0,255,136,.5);
    margin-bottom: 30px;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .loader-text {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #00ff88;
    margin-bottom: 15px;
    text-shadow: 0 0 20px rgba(0,255,136,.6);
  }
  .loader-percent {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #00ff88, #00e5ff, #ff2d55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
   /* ===== ПЛАВНЫЕ АНИМАЦИИ ===== */
  html { scroll-behavior: smooth; }

  /* Плавное появление/растворение для модалок */
  .modal-overlay {
    transition: opacity .4s ease !important;
  }
  .modal {
    transition: transform .4s cubic-bezier(.7,0,.3,1), opacity .4s ease !important;
  }

  /* Плавное появление треков */
  .track {
    animation: fadeInUp 0.6s cubic-bezier(.7,0,.3,1) backwards;
  }
  .track:nth-child(1)  { animation-delay: 0.05s; }
  .track:nth-child(2)  { animation-delay: 0.10s; }
  .track:nth-child(3)  { animation-delay: 0.15s; }
  .track:nth-child(4)  { animation-delay: 0.20s; }
  .track:nth-child(5)  { animation-delay: 0.25s; }
  .track:nth-child(6)  { animation-delay: 0.30s; }
  .track:nth-child(7)  { animation-delay: 0.35s; }
  .track:nth-child(8)  { animation-delay: 0.40s; }
  .track:nth-child(9)  { animation-delay: 0.45s; }
  .track:nth-child(10) { animation-delay: 0.50s; }

  @keyframes fadeInUp {
    0%   { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* Лайк (сердечко) */
  .like-btn {
    position: absolute;
    top: 10px; right: 10px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .3s ease;
    z-index: 5;
  }
  .like-btn:hover {
    background: rgba(255,45,85,0.3);
    border-color: rgba(255,45,85,0.6);
    transform: scale(1.1);
  }
  .like-btn.liked {
    background: linear-gradient(135deg, #ff2d55, #ff8800);
    border-color: #ff2d55;
    box-shadow: 0 0 20px rgba(255,45,85,0.7);
    animation: likePulse 0.5s ease;
  }
  @keyframes likePulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .like-count {
    position: absolute;
    bottom: -6px;
    right: -4px;
    background: #ff2d55;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    padding: 2px 6px;
    border-radius: 10px;
    min-width: 18px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(255,45,85,0.6);
  }
  .track { position: relative; }
</style>
</head>
<body>

 <!-- ЭКРАН ЗАГРУЗКИ -->
<div class="loading-screen" id="loadingScreen">
  <div class="loader-spinner"></div>
  <div class="loader-text">ЗАГРУЗКА</div>
  <div class="loader-percent" id="loaderPercent">0%</div>
</div>
 <div class="roll-line" id="rollLine" style="position:fixed;left:50%;top:50%;width:90vw;height:4px;background:linear-gradient(90deg,#00ff88,#00e5ff,#ff2d55);transform:translate(-50%,-50%) scaleX(0);transform-origin:center;border-radius:4px;z-index:200;pointer-events:none;box-shadow:0 0 40px rgba(0,255,136,.9);transition:transform .8s cubic-bezier(.7,0,.3,1);"></div>

<div class="scene">

  <div class="main-page" id="mainPage">
    <header>
      <nav class="left-nav">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
  /* ===== FIREBASE ===== */
  const firebaseConfig = {
    apiKey: "AIzaSyAnZKHJ5apEt865aNQnQF6PLuRYY0q_6jA",
    authDomain: "music1-39deb.firebaseapp.com",
    projectId: "music1-39deb",
    storageBucket: "music1-39deb.firebasestorage.app",
    messagingSenderId: "862127799209",
    appId: "1:862127799209:web:fc3a14111d886299f6e2b8",
    measurementId: "G-K2J47VGRZQ"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
 
/* ===== ЭКРАН ЗАГРУЗКИ ===== */
 window.addEventListener('DOMContentLoaded', () => {
const loadingScreen = document.getElementById('loadingScreen');
const loaderPercent = document.getElementById('loaderPercent');

let percent = 0;
const loadInterval = setInterval(() => {
  percent += Math.random() * 8 + 2;
  if (percent >= 100) {
    percent = 100;
    loaderPercent.textContent = '100%';
    clearInterval(loadInterval);
    setTimeout(() => {
      loadingScreen.classList.add('fade-out');
      setTimeout(() => {
        loadingScreen.style.display = 'none';
      }, 800);
    }, 300);
  } else {
    loaderPercent.textContent = Math.floor(percent) + '%';
  }
}, 80);
  });
   // ==== ЗВУК КЛИКА ====
  const clickSound = new Audio('click.mp3');
  clickSound.volume = 0.5;

  function playClick() {
    clickSound.currentTime = 0;
    clickSound.play().catch(() => {});
  }document.addEventListener('click',(e)=>{const btn=e.target.closest('button, .btn, nav a, .back-btn, .donate-btn');if(btn)playClick();});

/* ===== ЛАЙКИ ===== */
const likesRef = db.collection('likes');
async function loadLikes() {
  try {
    const snapshot = await likesRef.get();
    const likes = {};
    snapshot.forEach(doc => { likes[doc.id] = doc.data().count || 0; });
    return likes;
  } catch (e) {
    console.error('Ошибка загрузки лайков:', e);
    return {};
  }
}

async function toggleLike(trackIndex, btnEl, countEl) {
  const trackId = 'track_' + trackIndex;
  const docRef = likesRef.doc(trackId);
  const userLiked = localStorage.getItem('liked_' + trackId) === '1';

  try {
    const doc = await docRef.get();
    const currentCount = doc.exists ? (doc.data().count || 0) : 0;

    if (userLiked) {
      await docRef.set({ count: Math.max(0, currentCount - 1) }, { merge: true });
      localStorage.setItem('liked_' + trackId, '0');
      btnEl.classList.remove('liked');
      countEl.textContent = Math.max(0, currentCount - 1);
    } else {
      await docRef.set({ count: currentCount + 1 }, { merge: true });
      localStorage.setItem('liked_' + trackId, '1');
      btnEl.classList.add('liked');
      countEl.textContent = currentCount + 1;
    }
  } catch (e) {
    console.error('Ошибка лайка:', e);
  }
}

  const TRACKS = [
    { name: 'МОПСЫ ДОБРОЕ УТРО',         artist: 'МОПСЫ',           src: '13.mp4' },
    { name: 'Never Gonna Give You Up',   artist: 'Rick Astley',     src: '1.mp4' },
    { name: 'I Will Always Love You',    artist: 'Whitney Houston', src: '2.mp4' },
    { name: 'The Police',                artist: 'Sting',           src: '3.mp4' },
    { name: 'Белые розы',                artist: 'Ласковый май',    src: '4.mp4' },
    { name: 'Трава у дома',              artist: 'Земляне',         src: '6.mp4' },
    { name: 'Группа крови',              artist: 'Группа кино',     src: '7.mp4' },
    { name: 'Звезда по имени солнце',    artist: 'Группа кино',     src: '8.mp4' },
    { name: 'Маленькие девочки',         artist: 'Руки Вверх',      src: '9.mp4' },
    { name: 'Привет с большого бодуна',  artist: 'Дюна',            src: '10.mp4'},
    { name: 'ПОВОД',                     artist: 'MORGENSHTERN',    src: '11.mp4'},
    { name: 'Дурак и молния',            artist: 'Кароль и Шут',    src: '12.mp4'}
  ];

  const trackList = document.getElementById('trackList');

loadLikes().then(likes => {
  TRACKS.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track';
    el.dataset.index = i;
    el.dataset.search = (t.name + ' ' + t.artist).toLowerCase();

    const trackId = 'track_' + i;
    const userLiked = localStorage.getItem('liked_' + trackId) === '1';
    const likeCount = likes[trackId] || 0;

    el.innerHTML = `
      <button class="like-btn ${userLiked ? 'liked' : ''}" data-index="${i}">
        ❤
        <span class="like-count">${likeCount}</span>
      </button>
      <div class="track-video">
        <video src="${t.src}" preload="metadata" muted></video>
        <div class="track-play-overlay"></div>
      </div>
      <div class="track-info">
        <div class="track-name">${t.name}</div>
        <div class="track-artist">${t.artist}</div>
      </div>
    `;

    el.addEventListener('click', (e) => {
      if (e.target.closest('.like-btn')) return;
      openVideoModal(i);
    });

    const likeBtn = el.querySelector('.like-btn');
    const likeCountEl = el.querySelector('.like-count');
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLike(i, likeBtn, likeCountEl);
    });

    trackList.appendChild(el);
  });

  document.getElementById('totalCount').textContent = TRACKS.length;
});

  document.getElementById('searchBox').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase().trim();
    document.querySelectorAll('.track').forEach(el => {
      el.classList.toggle('hidden', q && !el.dataset.search.includes(q));
    });
  });

  const videoModal   = document.getElementById('videoModal');
  const modalVideo   = document.getElementById('modalVideo');
  const videoModalClose = document.getElementById('videoModalClose');

  function openVideoModal(i) {
    const t = TRACKS[i]; if (!t) return;
    modalVideo.src = t.src;
    modalVideo.play().catch(() => {});
    videoModal.classList.add('show');
    document.querySelectorAll('.track').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.track')[i].classList.add('active');
  }

  videoModalClose.addEventListener('click', () => {
    modalVideo.pause();
    videoModal.classList.remove('show');
  });
  videoModal.addEventListener('click', (e) => {
    if (e.target === videoModal) {
      modalVideo.pause();
      videoModal.classList.remove('show');
    }
  });

  const mainPage  = document.getElementById('mainPage');
  const musicPage = document.getElementById('musicPage');
  const goBtn     = document.getElementById('goBtn');
  const backBtn   = document.getElementById('backBtn');
  const rollLine  = document.getElementById('rollLine');

  goBtn.addEventListener('click', () => {
    mainPage.classList.add('roll-up');
    setTimeout(() => rollLine.classList.add('active'), 900);
    setTimeout(() => {
      rollLine.classList.remove('active');
      musicPage.classList.add('unroll');
    }, 1500);
  });

  backBtn.addEventListener('click', () => {
    modalVideo.pause();
    videoModal.classList.remove('show');
    musicPage.classList.remove('unroll');
    rollLine.classList.add('active');
    setTimeout(() => {
      rollLine.classList.remove('active');
      mainPage.classList.remove('roll-up');
    }, 700);
  });

  /* ===== МОДАЛКИ ===== */
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle   = document.getElementById('modalTitle');
  const modalText    = document.getElementById('modalText');
  const modalExtra   = document.getElementById('modalExtra');
  const modalClose   = document.getElementById('modalClose');
  const reviewsLink  = document.getElementById('reviewsLink');
  const featuresLink = document.getElementById('featuresLink');
  const aboutLink    = document.getElementById('aboutLink');
  const donateBtn    = document.getElementById('donateBtn');

  // ==== ОТЗЫВЫ ====
  let reviewsUnsubscribe = null;

  reviewsLink.addEventListener('click', () => {
    modalTitle.textContent = 'Отзывы';
    modalText.innerHTML = 'Оставьте свой отзыв о сайте:';
    modalExtra.innerHTML = `
      <div class="reviews-form">
        <input type="text" id="reviewName" placeholder="Ваше имя" maxlength="30">
        <textarea id="reviewText" placeholder="Ваш отзыв..." maxlength="500"></textarea>
        <button id="reviewSubmit">Отправить</button>
      </div>
      <div class="reviews-list" id="reviewsList">
        <div class="reviews-loading">Загрузка отзывов...</div>
      </div>
    `;
    modalOverlay.classList.add('show');
    loadReviews();
    setupReviewForm();
  });

  function setupReviewForm() {
    const btn = document.getElementById('reviewSubmit');
    if (!btn) return;
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const nameEl = document.getElementById('reviewName');
      const textEl = document.getElementById('reviewText');
      const name = nameEl.value.trim();
      const text = textEl.value.trim();

      if (!name || !text) {
        alert('Заполните имя и отзыв!');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Отправка...';

      try {
        await db.collection('reviews').add({
          name: name,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        nameEl.value = '';
        textEl.value = '';
        btn.textContent = '✅ Отправлено!';
        setTimeout(() => {
          btn.textContent = 'Отправить';
          btn.disabled = false;
        }, 1500);
      } catch (err) {
        console.error(err);
        btn.textContent = 'Ошибка!';
        setTimeout(() => {
          btn.textContent = 'Отправить';
          btn.disabled = false;
        }, 1500);
      }
    });
  }

  function loadReviews() {
    const listEl = document.getElementById('reviewsList');
    if (!listEl) return;
    if (reviewsUnsubscribe) reviewsUnsubscribe();

    reviewsUnsubscribe = db.collection('reviews')
      .orderBy('createdAt', 'desc')
      .limit(50)
      .onSnapshot((snapshot) => {
        if (snapshot.empty) {
          listEl.innerHTML = '<div class="reviews-loading">Пока отзывов нет. Будьте первым!</div>';
          return;
        }
        listEl.innerHTML = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          const date = data.createdAt ? data.createdAt.toDate() : new Date();
          const dateStr = date.toLocaleDateString('ru-RU') + ' ' +
                         date.toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'});

          const div = document.createElement('div');
          div.className = 'review-item';
          div.innerHTML = `
            <div class="review-header">
              <span class="review-name">${escapeHtml(data.name || 'Аноним')}</span>
              <span class="review-date">${dateStr}</span>
            </div>
            <div class="review-text">${escapeHtml(data.text || '')}</div>
          `;
          listEl.appendChild(div);
        });
      }, (err) => {
        console.error(err);
        listEl.innerHTML = '<div class="reviews-loading">Ошибка загрузки отзывов</div>';
      });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ==== ФИШКИ ====
  featuresLink.addEventListener('click', () => {
    modalTitle.textContent = 'Фишки';
    modalText.innerHTML = '<div class="empty-message">Песни на любой вкус и цвет если песни нет но пишите в отзывах!</div>';
    modalExtra.innerHTML = '';
    modalOverlay.classList.add('show');
  });

  // ==== О НАС ====
  aboutLink.addEventListener('click', () => {
    modalTitle.textContent = 'О нас';
    modalText.innerHTML = 'Я маленькая личинка чуувствую себя чемно большим.По вопросам пишите на почту:';
    modalExtra.innerHTML = `
      <button class="email" id="copyBtn2">📋 Скопировать почту</button>
      <span class="email-sub">Почта: <strong>wegetebel3@gmail.com</strong></span>
    `;
    modalOverlay.classList.add('show');
    document.getElementById('copyBtn2').addEventListener('click', (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      if (navigator.clipboard) navigator.clipboard.writeText('wegetebel3@gmail.com').then(() => {
        btn.textContent = '✅ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 Скопировать почту'; btn.classList.remove('copied'); }, 2000);
      });
    });
  });

  // ==== ДОНАТ ====
  donateBtn.addEventListener('click', () => {
    modalTitle.textContent = '💰 Донат';
    modalText.innerHTML = 'Понравилось? Скинь 20 руб 🙏<br><br>Карта:';
    modalExtra.innerHTML = `
      <button class="email" id="copyCardBtn">📋 2202 2092 0978 6770</button>
      <span class="email-sub">Нажми чтобы скопировать</span>
    `;
    modalOverlay.classList.add('show');
    document.getElementById('copyCardBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      const btn = e.currentTarget;
      if (navigator.clipboard) navigator.clipboard.writeText('2202209209786770').then(() => {
        btn.textContent = '✅ Скопировано!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 2202 2092 0978 6770'; btn.classList.remove('copied'); }, 2000);
      });
    });
  });

  modalClose.addEventListener('click', () => {
    modalOverlay.classList.remove('show');
    if (reviewsUnsubscribe) reviewsUnsubscribe();
  });
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('show');
      if (reviewsUnsubscribe) reviewsUnsubscribe();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      modalVideo.pause();
      videoModal.classList.remove('show');
      modalOverlay.classList.remove('show');
      if (reviewsUnsubscribe) reviewsUnsubscribe();
    }
  });
</script>
